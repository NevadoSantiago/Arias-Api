# Test-only values for settings that have no default in the main application.yml.
# Activated by spring.profiles.active in config/application.yml.
arias:
  jwt:
    secret: test-only-secret-not-used-anywhere-else-32-chars
  bootstrap:
    admin:
      password: test-only-bootstrap-password
  # Tests must never reach a real external service. An empty api-key makes the
  # email sender log instead of calling Resend (guarded by NoRealEmailInTestsTest).
  email:
    api-key: ""
  # Placeholder storage settings so the R2 client can be built; no test uploads.
  r2:
    endpoint: https://r2.test.invalid
    access-key-id: test-access-key
    secret-access-key: test-secret-key
    public-url: https://r2.test.invalid/public
  # sha256("test-print-agent-key"); the agent tests send that dummy key.
  print-agent:
    key-sha256: aedf6eff49b74979c69215396f6f88bda24f386977dad2b5ee3893768cc28b63
  mercadopago:
    enabled: false
    access-token: ""
